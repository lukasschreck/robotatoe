el:`geliefert 11:11`},{wer:`Eyads Bot`,was:`Konzeptseite`}],danach:`Die Keks-Inspektorin prüft jeden Teil, die Landingpage-Texte und die Konzeptseite noch vor der Abgabe.`,quelle:`Robby, 20.11.`},{titel:`Gründungsphase: zuerst die Firma, dann das Produkt`,seit:`11:09`,frist:`11:20`,aufgaben:[{wer:`Graf Kabelbrand`,was:`Drei Firmennamen mit Slogan`,status:`aktiv`,label:`geliefert`},{wer:`Wuschel von Flauschenstein`,was:`Drei Entscheidungsregeln`,status:`aktiv`,label:`geliefert`},{wer:`Ada`,was:`Firmen-Dashboard`},{wer:`Eyads Bot`,was:`Mission`,status:`aktiv`,label:`übernommen 11:13`}],danach:`Namensabstimmung um 11:35 ausgezählt. Name: Crewlane, von Lukas freigegeben.`,quelle:`Robby, 20.11.`}],phase4:{titel:`Phase 4: Schärfung`,status:`vorschlag`,statusText:`Vorschlag Moderator, nicht beschlossen`,punkte:[`Telefon und WhatsApp statt nur Slack, weil Handwerksbetriebe Aufträge vor allem am Telefon verlieren. Ob das in Starter oder Team gehört, ist eine offene Frage an Lukas; Wuschel prüft.`,`Angebote nur aus den eigenen Preisen und Stammdaten des Betriebs, weil HERO und plancraft das direkt in ihre Software einbauen.`,`Liegengebliebene Freigaben über den Freigabe-Wächter sichtbar machen.`,`Bei offenen Angeboten und unbeantworteten Kundenmails nachfassen, statt nur Entwürfe zu schreiben.`,`DSGVO konkret: Auftragsverarbeitungsvertrag (AVV) und KI-Hinweis nach der KI-Verordnung von Anfang an. Ob das verbindlich zugesagt wird, ist eine offene Frage an Lukas.`],cfo:{titel:`CFO-Empfehlung zu Punkt 1 (Telefon)`,status:`vorschlag`,statusText:`Vorschlag CFO, Entscheidung Lukas offen`,punkte:[`Team (ca. 149 €): Telefon fest enthalten, mit Minutenkontingent (Höhe offen); danach ein Hinweis statt einer Überraschung auf der Rechnung.`,`Starter (ca. 49 €), Fassung A: WhatsApp-Text plus Anrufliste.`,`Starter (ca. 49 €), Fassung B: Telefon als Zusatzmodul.`,`Der Telefon-Bot nimmt nur auf, nennt keine Preise und sagt keine Termine zu; alles geht als Entwurf zur Freigabe.`,`Der Krümelzähler rechnet die Kosten pro Minute.`],quelle:`Robby, 20.11. (Wuschel, Marktcheck-Thread, 11:42)`},wettbewerb:[`Lindy ab 29,99 $ pro Nutzer`,`Marblism ab 24 $`,`HERO mit KI-Angeboten ab etwa 119 €`],vorteil:`Festpreis statt Credits.`,risiken:[`US-Anbieter besetzen den Begriff „KI-Mitarbeiter“.`,`Handwerkersoftware baut die KI selbst ein.`,`Das Vertrauen ist weg, sobald ein Preis ohne Klick rausgeht.`],quelle:`Robby, 20.11. (Eyads Bot im Marktcheck-Thread, 11:42)`},landing:{titel:`Landingpage-Text`,status:`aktiv`,statusText:`geliefert, von Ada freigegeben`,headline:`Crewlane – Your bot team. Your final click.`,intro:`Ihr fertiges Bot-Team für Slack oder E-Mail: Es bereitet Mails, Termine, Angebote und Support-Antworten vor, und nichts geht raus ohne Ihren Klick.`,fuerWen:`Kleine Firmen mit 5 bis 50 Leuten ohne eigene IT.`,schritte:[`Bots auswählen`,`Postfach oder Slack verbinden`,`Entwürfe prüfen und mit einem Klick freigeben`],preise:[`Starter: 1 Bot nach Wahl (Postfach oder Termine).`,`Team: Mail-Bot, Koordinator, Termin- und Angebots-Bot.`],cta:`Jetzt Pilotplatz anfragen`,quelle:`Robby, 20.11.`},demo:{titel:`Demo-Ablauf`,autor:`Robby`,hinweis:`Daten fiktiv, Beispiel: ein Elektrobetrieb`,schritte:[`Eine Mail kommt rein.`,`Der Koordinator ordnet sie zu.`,`Der Entwurf erscheint in der Freigabe-Ansicht.`,`Der Kunde gibt per Klick frei, sonst greift die Regel für Entwürfe.`,`Alles steht in der Protokoll-Ansicht.`],quelle:`Robby, 20.11., 11:11`},spielregeln:{status:`entschieden`,statusText:`übernommen ✅ (Vorschlag Wuschel)`,regeln:[{titel:`Bots schlagen vor, Menschen entscheiden`,text:`Alles mit Geld, Kunden, Verträgen, Terminen oder Daten nach außen braucht das OK von Eyad, Ada, Lukas oder Jessica.`},{titel:`Intern entscheidet die Rolle`,text:`Intern entscheidet die jeweilige Rolle. Bei Streit gilt die einfache Mehrheit per ✅/❌ mit Deadline.`},{titel:`Vier Augen und Protokoll`,text:`Jeder Entwurf wird von einem zweiten Bot geprüft, jede Entscheidung kommt mit Begründung
